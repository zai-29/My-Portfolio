{% extends "base.html" %}
{% block title %}Contact | Gabriel Calasang{% endblock %}

{% block content %}
<section class="narrow">
    <h1>Contact</h1>
    <dl class="contact">
        <dt>Email</dt><dd><a href="mailto:{{ profile.email }}">{{ profile.email }}</a></dd>
        <dt>Phone</dt><dd>{{ profile.phone }}</dd>
        <dt>Location</dt><dd>{{ profile.location }}</dd>
        <dt>GitHub</dt><dd>{{ profile.github }}</dd>
    </dl>
</section>
{% endblock %}
