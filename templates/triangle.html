{% extends "base.html" %}
{% block title %}Area of a Triangle | Gabriel Calasang{% endblock %}

{% block content %}
<section class="split">
    <div>
        <h1>Area of a triangle</h1>
        <p class="muted">The prism reshapes as you type. Drag it to rotate.</p>
        <form id="area-form" action="{{ url_for('compute_triangle') }}" method="post" class="stack">
            <label for="base">Base</label>
            <div class="row">
                <input type="number" id="base" name="base" step="any" min="0.01" value="4" required>
                <select id="unit" name="unit" aria-label="Unit of the base and height">{% for u in units %}<option value="{{ u }}"{{ " selected" if u == "cm" }}>{{ u }}</option>{% endfor %}</select>
            </div>
            <label for="height">Height</label>
            <input type="number" id="height" name="height" step="any" min="0.01" value="3" required>
            <label for="out_unit">Show the area in</label>
            <select id="out_unit" name="out_unit">
                <option value="same">same unit as the base</option>
                {% for u in units %}<option value="{{ u }}">{{ u }}²</option>{% endfor %}
            </select>
            <button class="btn" type="submit">Compute area</button>
        </form>
        <p id="status" class="status" role="status"></p>
        <p id="output" class="result" aria-live="polite"></p>
        <p id="detail" class="muted"></p>
    </div>
    <div>
        <div id="stage" class="stage" data-shape="triangle"></div>
        <p id="grid-note" class="muted caption"></p>
    </div>
</section>

<section id="history" class="history-box">{% include "_history.html" %}</section>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('static', filename='js/shapes.js') }}"></script>
{% endblock %}
